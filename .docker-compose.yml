version: '3.8'
services:
  app_dockervsion:
    container_name: app_dockervsion
    restart: always
    build:
      context: .
      dockerfile: dockerfile

    env_file:
      - .env

    ports:
      - "${port}:3000"
    
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

    command: npm start

    networks:
      - dockervsion-network
        
networks:
  dockervsion-network:
   



  